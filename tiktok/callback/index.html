<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Connecting to auto…</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0b0e13; color: #e6edf3;
      font: 16px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 520px; padding: 32px 24px; text-align: center; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { color: #8b98a8; }
    a { color: #ff8a1f; }
    code { background: #131820; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
<main>
  <h1>Connecting to auto…</h1>
  <p>
    Opening your local dashboard to finish the TikTok authorization.
    If nothing happens, start the dashboard with <code>factory web</code> and
    <a id="manual" href="http://127.0.0.1:8080/tiktok/callback">continue manually</a>.
  </p>
</main>
<script>
  var target = "http://127.0.0.1:8080/tiktok/callback" + window.location.search;
  document.getElementById("manual").href = target;
  setTimeout(function () { window.location.href = target; }, 800);
</script>
</body>
</html>
